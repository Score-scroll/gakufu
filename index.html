<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>楽譜スクロール</title>
<meta name="theme-color" content="#FFF5C9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="楽譜スクロール">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#FFF5C9; --card:#FFFFFF; --ink:#4A3428; --sub:#7A6152; --red:#D63B3B; --red-dk:#B02A2A;
  --line:#EADBB0; --shadow:0 4px 14px rgba(120,80,0,.12);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ===== 一覧画面 ===== */
#library{min-height:100%;padding:calc(24px + var(--safe-t)) 24px calc(40px + var(--safe-b))}
.lib-head{max-width:980px;margin:0 auto 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lib-head h1{margin:0;font-size:30px;color:var(--red);display:flex;align-items:center;gap:10px;flex:1 1 auto}
.lib-head h1 img{width:44px;height:44px;border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;
  border-radius:999px;border:0;font-weight:700;font-size:18px}
.btn-red{background:var(--red);color:#fff;box-shadow:var(--shadow)}
.btn-red:active{background:var(--red-dk)}
.btn-ghost{background:#fff;border:2px solid var(--line)}
.lib-hint{max-width:980px;margin:0 auto 18px;color:var(--sub);font-size:15px;line-height:1.7}
.grid{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card-open{border:0;background:none;padding:0;text-align:left;display:block;width:100%}
.thumb{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;background:#f4f1e8;display:block;border-bottom:1px solid var(--line)}
.card-body{padding:12px 14px 6px}
.card-title{font-weight:700;font-size:17px;line-height:1.4;word-break:break-all}
.card-meta{color:var(--sub);font-size:13px;margin-top:2px}
.card-actions{display:flex;gap:4px;padding:4px 8px 10px}
.mini{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--sub);font-size:14px}
.mini:active{background:#f4efe0}
.empty{max-width:560px;margin:60px auto;text-align:center;color:var(--sub);line-height:1.9;background:#fff;border-radius:20px;padding:36px 28px;box-shadow:var(--shadow)}
.empty b{color:var(--red)}
.busy{position:fixed;inset:0;background:rgba(255,245,201,.85);display:flex;align-items:center;justify-content:center;z-index:50}
.busy-box{background:#fff;border-radius:20px;padding:28px 36px;box-shadow:var(--shadow);text-align:center;min-width:280px}
.bar{height:10px;background:#f2ead2;border-radius:99px;overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}

/* ===== 楽譜画面 ===== */
#viewer{position:fixed;inset:0;background:#fff}
#scroller{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#pages{margin:0 auto;padding-bottom:70vh}
#pages img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
#pages img+img{border-top:1px dashed #e5e0d0}
.top-pad{height:calc(8px + var(--safe-t))}

#controls{position:absolute;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);
  width:min(980px,calc(100% - 20px));background:rgba(255,250,232,.97);border:2px solid var(--line);border-radius:22px;
  box-shadow:0 8px 28px rgba(80,50,0,.18);padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
  transition:opacity .35s, transform .35s}
#controls.dim{opacity:0;pointer-events:none;transform:translate(-50%,20px)}
.ctl{min-width:48px;min-height:48px;border-radius:14px;border:0;background:#fff;display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 1px 0 var(--line)}
.ctl:active{background:#f4efe0}
.ctl svg{width:26px;height:26px}
#playBtn{min-width:64px;background:var(--red);color:#fff}
#playBtn:active{background:var(--red-dk)}
.grp{display:flex;align-items:center;gap:6px}
.lbl{font-size:13px;color:var(--sub);white-space:nowrap}
.speed-val{min-width:34px;text-align:center;font-weight:700;font-size:20px;color:var(--red)}
input[type=range]{accent-color:var(--red);width:150px;height:44px}
.spacer{flex:1 1 0}
.info{font-size:13px;color:var(--sub);white-space:nowrap}
select{min-height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;padding:0 8px}
#title{font-weight:700;font-size:15px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#mini{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + var(--safe-b));
  min-height:52px;padding:0 18px;border-radius:999px;border:0;background:rgba(214,59,59,.9);color:#fff;font-weight:700;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
#mini svg{width:22px;height:22px}
#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#countdown span{font-size:180px;font-weight:900;color:var(--red);text-shadow:0 0 0 #fff,0 6px 30px rgba(255,255,255,.9);opacity:.9}
#toast{position:absolute;left:50%;top:calc(20px + var(--safe-t));transform:translateX(-50%);background:rgba(74,52,40,.92);color:#fff;
  padding:12px 22px;border-radius:999px;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:700px){ input[type=range]{width:110px} #title{max-width:120px} }
</style>
</head>
<body>

<!-- 一覧画面 -->
<main id="library">
  <div class="lib-head">
    <h1><img src="icons/icon-192.png" alt="">楽譜スクロール</h1>
    <label class="btn btn-red" for="fileInput">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      楽譜を追加
    </label>
    <input id="fileInput" type="file" accept="application/pdf,.pdf,image/*" multiple class="hidden">
  </div>
  <p class="lib-hint">PDFや写真の楽譜を追加すると、このiPadの中に保存されます。一度入れた楽譜は、ネットがなくても開けます。<br>写真を何枚か一度に選ぶと、名前の順に並べて1つの楽譜になります。</p>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty hidden">
    まだ楽譜がありません。<br>右上の <b>「楽譜を追加」</b> から、PDFや楽譜の写真を選んでください。
  </div>
</main>

<div id="busy" class="busy hidden" role="status" aria-live="polite">
  <div class="busy-box"><div id="busyText">読み込み中…</div><div class="bar"><i id="busyBar"></i></div></div>
</div>

<!-- 楽譜画面 -->
<section id="viewer" class="hidden" aria-label="楽譜">
  <div id="scroller"><div class="top-pad"></div><div id="pages"></div></div>
  <div id="countdown" class="hidden" aria-live="assertive"><span id="countNum">3</span></div>
  <div id="toast" role="status"></div>

  <button id="mini" class="hidden" aria-label="一時停止">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    <span id="miniSpeed">速さ 10</span>
  </button>

  <div id="controls">
    <button class="ctl" id="backBtn" aria-label="一覧にもどる">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"/></svg>
    </button>
    <span id="title"></span>
    <button class="ctl" id="topBtn" aria-label="最初にもどる">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="5"/><polyline points="7 14 12 9 17 14"/><line x1="12" y1="9" x2="12" y2="20"/></svg>
    </button>
    <button class="ctl" id="playBtn" aria-label="スタート">
      <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg id="icoPause" class="hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <div class="grp">
      <span class="lbl">速さ</span>
      <button class="ctl" id="slower" aria-label="おそく">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="12" x2="18" y2="12"/></svg>
      </button>
      <span class="speed-val" id="speedVal">10</span>
      <button class="ctl" id="faster" aria-label="はやく">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
      </button>
      <label class="hidden" for="speed">速さ</label>
      <input id="speed" type="range" min="1" max="60" step="1" value="10">
    </div>
    <span class="info" id="perPage"></span>
    <div class="spacer"></div>
    <div class="grp">
      <label class="lbl" for="countSel">開始前</label>
      <select id="countSel"><option value="0">すぐ</option><option value="3">3秒</option><option value="5">5秒</option><option value="10">10秒</option></select>
    </div>
    <div class="grp">
      <label class="lbl" for="widthSel">表示幅</label>
      <select id="widthSel"><option value="100">100%</option><option value="90">90%</option><option value="80">80%</option><option value="70">70%</option><option value="60">60%</option></select>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
